services:
  db_test:
    image: postgres:16-alpine
    container_name: postgres_container_test
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdatatest:/var/lib/postgresql/data

volumes:
  pgdatatest:
